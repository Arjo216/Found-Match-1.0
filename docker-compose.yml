version: '3.8'

services:
  # --- THE DATABASE ---
  db:
    image: postgres:15-alpine
    container_name: foundmatch_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: foundmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- THE AI BACKEND ---
  backend:
    build:
      context: . # 🛡️ CRUCIAL: Tells Docker to read from the ROOT folder, not just Web-Dev 2.0
      dockerfile: "Web-Dev 2.0/Dockerfile"
    container_name: foundmatch_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Connects FastAPI to the Docker Postgres container
      - DATABASE_URL=postgresql://postgres:supersecretpassword@db:5432/foundmatch
      - ENV=development
      # Tells Python that the root /app folder is available for imports (fixes ML imports)
      - PYTHONPATH=/app
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      # Maps all 3 of your local folders into the container!
      - "./Web-Dev 2.0:/app/backend"
      - "./ml_engine:/app/ml_engine"
      - "./data:/app/data"

volumes:
  pgdata: